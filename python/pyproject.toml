# Maturin-based wheel for the phantom_protocol Python binding.
#
# Unlike the setuptools config in tests/bindings/pyproject.toml (which
# produces a pure-Python wheel that requires a separately staged native lib),
# THIS config produces a platform-specific wheel that bundles the cdylib
# directly — so `pip install phantom-protocol-<platform>.whl` works without
# any extra steps.
#
# Build a wheel (from this directory — manifest-path is set below):
#   pip install maturin
#   cd python && maturin build --release
#
# The produced wheel lands in target/wheels/. Check it end to end with
#   python/verify_wheel.sh
# which builds, installs into a fresh venv and exercises the imported package.
#
# To install directly from source (development):
#   cd python && maturin develop --release
#
# Publishing (manual — see tests/bindings/PACKAGING.md):
#   maturin publish --manifest-path core/Cargo.toml
#   (needs MATURIN_PYPI_TOKEN env var or ~/.pypirc)

[build-system]
requires = ["maturin>=1.6,<2.0"]
build-backend = "maturin"

[project]
name = "phantom-protocol"
# Version is read from core/Cargo.toml by maturin; keep in sync manually if
# overriding here. Remove the line below to have maturin derive it from Cargo.
version = "0.3.0"
description = "Post-quantum-secure L4/L6 transport SDK (Python binding)"
readme = "../README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Phantom Protocol developers" }]
keywords = ["post-quantum", "cryptography", "transport", "uniffi", "ml-kem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Internet",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Repository = "https://github.com/snaart/phantom_protocol"
Documentation = "https://docs.rs/phantom-protocol"

[tool.maturin]
# maturin uniffi mode: builds the cdylib, then calls the uniffi-bindgen binary
# (from core/src/bin/uniffi-bindgen.rs, compiled under --features uniffi-cli)
# to generate the Python glue, and bundles both into the wheel.
bindings = "uniffi"

# Point at the library crate. maturin resolves the cdylib from here.
# This is a relative path from the directory where maturin is invoked;
# the CI job runs from the repo root via `--manifest-path ../core/Cargo.toml`
# (overriding this value on the command line is the recommended approach when
# the pyproject.toml is in a subdirectory).
manifest-path = "../core/Cargo.toml"

# Enable the bindings feature (UniFFI scaffolding). The uniffi-cli feature
# gates the uniffi-bindgen binary; maturin enables it automatically when
# bindings = "uniffi".
features = ["bindings"]

# NO `python-source` HERE, deliberately. In uniffi bindings mode maturin does not
# generate a single module — it generates a PACKAGE directory named after the
# crate, holding `phantom_protocol.py`, an `__init__.py` that star-imports it,
# and the cdylib. Setting `python-source = "."` made maturin merge that package
# into the hand-written `python/phantom_protocol/` of the same name, so the wheel
# shipped `phantom_protocol/__init__.py` alongside a nested
# `phantom_protocol/phantom_protocol/` — and `import phantom_protocol` then died
# on `cannot import name '__all__' from 'phantom_protocol.phantom_protocol'`,
# because the name it reached was the generated sub-PACKAGE (whose `__init__.py`
# only star-imports and so re-exports no `__all__`) rather than the generated
# module. Letting maturin own the package outright gives the layout its own
# `__init__.py` is written for:
#
#     phantom_protocol/__init__.py            from .phantom_protocol import *
#     phantom_protocol/phantom_protocol.py    the generated glue
#     phantom_protocol/libphantom_protocol.*  the cdylib, loaded by the glue
#
# `python/verify_wheel.sh` builds a wheel from this file and imports it in a
# throwaway venv, which is what keeps that claim honest.

# Strip debug symbols in release mode to keep the wheel size reasonable.
# The workspace release profile already strips symbols; this is a belt-and-
# suspenders note for maturin's own strip logic.
strip = true
