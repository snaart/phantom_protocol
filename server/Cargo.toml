[package]
name = "phantom-server"
version = "0.3.0"
edition = "2021"
description = "Reference production server for phantom_core"

# Out of the core/-only workspace — sibling crate convention.
[workspace]

[[bin]]
name = "phantom-server"
path = "src/main.rs"

[dependencies]
# The reference server embeds the Rust API directly and does not generate FFI
# bindings, so it opts out of the default `bindings` feature (and with it the
# whole UniFFI dependency tree). `std` + `compression-zstd` reproduce the rest
# of the historical default surface. (SUPPLY-01)
phantom_core = { path = "../core", default-features = false, features = [
    "std",
    "compression-zstd",
    "telemetry-otel",
] }
tokio = { version = "1.36", features = ["full"] }   # binary owns its runtime
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hex = "0.4"
futures = "0.3"

# --- OpenTelemetry (Phase 8) ---
# The library exports OTel instruments; the server owns the SDK lifecycle —
# installs `MeterProvider` / `TracerProvider` and the OTLP exporter before
# any handshake records anything.
opentelemetry = { version = "0.28", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.28", default-features = false, features = [
    # `gzip-tonic` is load-bearing: telemetry.rs calls `.with_compression(Gzip)`
    # on both exporters, and without this feature that fails at startup with
    # "Metrics exporter feature 'gzip-tonic' is required ...", taking the whole
    # server down before it binds.
    "grpc-tonic", "metrics", "trace", "gzip-tonic",
] }
tracing-opentelemetry = "0.29"
