[workspace]
resolver = "2"
members = [
    "core",
]
# `cli/`, `tests/`, and `server/` are sibling crates that depend on
# `phantom-protocol` via a path dependency but are intentionally NOT workspace
# members (see README.md). `server/` is the reference embedder binary.
# `fuzz/` is the cargo-fuzz harness crate, also excluded because libfuzzer-sys
# requires nightly and we don't want to pull it into stable builds.
# Listing them here makes cargo's workspace-membership check explicit and
# silences "package believes it's in a workspace when it's not" errors.
exclude = [
    "cli",
    "tests",
    "fuzz",
    "server",
]

# Release profile lives at the workspace root so cargo actually picks it up;
# `[profile.release]` declarations in non-root members are silently ignored.
# We optimize for **speed** here (production transport library), not size — a
# separate `release-size` profile is provided for footprint-constrained targets.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
overflow-checks = false

# Size-optimized build for embedded / mobile bundles.
[profile.release-size]
inherits = "release"
opt-level = "z"
strip = "symbols"

# Bench profile inherits release but keeps debug info for profilers (perf, samply,
# flamegraph). Use `cargo bench --profile=bench` (the default).
[profile.bench]
inherits = "release"
debug = true
strip = "none"

# Dist profile for final shipped artifacts: identical to release plus PGO-ready
# layout. PGO instrumentation is added on the command line, not in this profile.
#
# One deliberate difference from `release`, and it is the reason the release
# workflow builds with this profile rather than that one: the symbol table
# stays. `release` sets `strip = "symbols"`, which is right for a developer's
# build and wrong for a shipped library — `uniffi-bindgen --library` reads the
# `UNIFFI_META_*` symbols out of the cdylib to generate the bindings, and a
# stripped Linux `.so` keeps the metadata *strings* in `.rodata` while losing
# the `.symtab` entries that name them, so the generator finds no namespace and
# refuses. The 0.3.0 Linux artifacts shipped in exactly that state.
#
# Keeping the table costs bytes, not speed: every optimisation setting is
# inherited unchanged, `debug` stays `false`, so what comes back is the symbol
# names and nothing else. Putting it here rather than in `release` is what keeps
# an ordinary `cargo build --release` as small as it was; the three
# `tests/bindings/generate_*.sh` scripts reach the same state from the other
# direction, with `CARGO_PROFILE_RELEASE_STRIP=none` on a release build.
[profile.dist]
inherits = "release"
strip = "none"
