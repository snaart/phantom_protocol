[package]
name = "phantom-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "phantom-cli"
path = "src/main.rs"

[dependencies]
phantom-protocol = { path = "../core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hex = "0.4"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
