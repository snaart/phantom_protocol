[package]
name = "phantom_core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }

# Memory Allocator
mimalloc = "0.1"

# Serialization & Compression
# Serialization & Compression
rkyv = { version = "0.7", features = ["validation", "strict"] }
bytecheck = "0.6"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }

# Cryptography
rand = "0.8"
zeroize = "1"
# Classical
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
chacha20poly1305 = "0.10" # Authenticated Encryption (Fixes C-02)
# Post-Quantum (Using pqcrypto-kyber for FFI binding to reference impl)
pqcrypto-kyber = "0.8" 
pqcrypto-traits = "0.3"

# KDF & Hashing
hkdf = "0.12"
sha2 = "0.10"
# MLS (0.6.x compatible set)
openmls = "0.6"
openmls_rust_crypto = "0.3"
openmls_basic_credential = "0.3"

# Database
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }

# Error Handling
thiserror = "1"
anyhow = "1"

# Utils
bytes = "1"
futures = "0.3"
log = "0.4"
once_cell = "1.18"

# TLS
tokio-rustls = "0.24"
rustls = { version = "0.21" }
rustls-pemfile = "1"
webpki-roots = "0.25"
rcgen = "0.11" 
time = "=0.3.36" # Pin to avoid rustc version issues

# FFI
uniffi = { version = "0.28", features = ["tokio", "cli"] }
blake3 = "1.8.3"
hex = "0.4.3"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
blake3 = "1.8.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
uniffi = { version = "0.28", features = ["bindgen-tests"] }

[lib]
name = "phantom_core"
crate-type = ["lib", "cdylib"]
