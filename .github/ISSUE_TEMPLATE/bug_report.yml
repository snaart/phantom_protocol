name: Bug report
description: Report a defect in Phantom Protocol
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        **Do not report security vulnerabilities here.** Please use the private
        [security advisory](https://github.com/snaart/phantom_protocol/security/advisories/new)
        flow instead (see [SECURITY.md](https://github.com/snaart/phantom_protocol/blob/main/SECURITY.md)).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps, ideally with a code snippet or failing command.
      placeholder: |
        1. Build with `cargo build --manifest-path core/Cargo.toml --features ...`
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened, including any error output or backtrace.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `rustc --version`, target triple, OS, and the feature flags / cargo command used.
      placeholder: |
        - rustc: 1.XX.0
        - target: x86_64-unknown-linux-gnu
        - OS: ...
        - features: compression-zstd, std, bindings (default)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, screenshots, or anything else that helps.
    validations:
      required: false
