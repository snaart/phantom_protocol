# Dependabot keeps dependencies and the SHA-pinned GitHub Actions fresh.
# Action `uses:` are pinned to full commit SHAs (see the workflows); the
# `github-actions` ecosystem below proposes SHA bumps as reviewable PRs so the
# pins never go stale silently.
#
# Cargo is declared once per manifest tree. The workspace root (`/`, members =
# ["core"]) and each sibling crate carry their own `[workspace]`, so they are
# distinct update surfaces.
version: 2
updates:
  # ── Cargo: workspace root (core) ──────────────────────────────────────────
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # ── Cargo: sibling crates (each has its own [workspace]) ──────────────────
  - package-ecosystem: cargo
    directory: /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /examples/wasm-demo
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /examples/observability-demo
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # ── GitHub Actions: keep the SHA pins current ─────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        update-types:
          - minor
          - patch
    ignore:
      # dtolnay/rust-toolchain selects the Rust channel by branch (stable /
      # nightly / 1.93.0 are different branch tips → different commit SHAs).
      # Dependabot can't model that and tries to unify all three pins to one
      # SHA, which silently repoints the nightly pins to the stable revision
      # and breaks miri/fuzz. The pins are kept fresh manually instead.
      - dependency-name: "dtolnay/rust-toolchain"
