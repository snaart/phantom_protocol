name: Release

# Two trigger surfaces:
# 1. `cargo-semver-checks` on every PR — produces the list of public Rust API
#    breaks against the published release, and requires each one to be written
#    down in CHANGELOG.md before the PR lands.
# 2. A tag push (`v*.*.*`) triggers the release pipeline:
#    publish dry-run + build release artifacts + GitHub Release draft.
on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*.*.*'
  # Manual trigger for the Python wheel smoke-test job. Does not trigger on
  # every push; run from the GitHub Actions "Run workflow" button.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least-privilege default for GITHUB_TOKEN; the build-artifacts and draft-release
# jobs opt into the elevated scopes they need (id-token/attestations/contents).
permissions:
  contents: read

# A release (or its PR semver check) must never be cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── SemVer hygiene ────────────────────────────────────────────────
  # `cargo-semver-checks` compares this branch's public surface against the
  # latest `phantom-protocol` published on crates.io, and the comparison is
  # kept: written to the job summary and uploaded as an artifact, so the list
  # of what broke exists while the change is being reviewed rather than being
  # reconstructed on release day.
  #
  # What fails this job, and what does not. A 0.x crate is allowed to break its
  # Rust API between minors, so the tool *finding* breakage is not a failure —
  # it is a fact to record. Two things are failures: a run that could not
  # compare anything, and a break that nobody wrote down. The first is caught by
  # `scripts/semver_report.sh` (which insists on a verdict line rather than
  # trusting the exit code), the second by `scripts/check_changelog_breaking.py`.
  #
  # This replaces a `continue-on-error: true` step that had never compared
  # anything: with no feature flags the tool enables every feature it does not
  # recognise as exotic, which for this crate means `fips` and `no-std`
  # together, which `core/src/lib.rs` rejects with a `compile_error!`. The run
  # died building rustdoc for the current crate and exited non-zero — the same
  # non-zero a genuine finding produces, and swallowed the same way. See
  # `scripts/semver_report.sh` for the feature set that does build and for what
  # it still cannot see.
  semver-checks:
    name: cargo-semver-checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # No `fetch-depth: 0`: the baseline is the crate published on crates.io,
      # resolved through the registry, and no step here passes `--baseline-rev`.
      # Git history supplied nothing to this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      # A prebuilt binary rather than `obi1kenobi/cargo-semver-checks-action`:
      # that action runs the tool itself and leaves the output only in the job
      # log, and the report is the deliverable here. `taiki-e/install-action` is
      # already the installer this repository uses for cargo-fuzz.
      #
      # The version is pinned. Unpinned, the installer takes whatever was
      # released last, so the set of lints that decides this job changes under
      # a PR that did not touch it: a new release that adds a lint can fail an
      # unchanged tree, and the failure reads as a defect in whichever PR
      # happened to run next. When 0.50.0 was pinned it was run against this
      # tree on rustc 1.93.0 (the MSRV) and 1.98.1 (the `stable` of the day):
      # both runs reached a verdict, they agreed, and every break they
      # reported is named in CHANGELOG.md. The installer's manifest at the
      # pinned action SHA carries this version's checksums.
      #
      # The cost of a pin is that `stable` keeps moving and the tool does not:
      # a later rustc can emit a rustdoc JSON format this release cannot read.
      # That fails loudly — semver_report.sh finds no verdict line and exits
      # non-zero — and the fix is to move the pin, as its own change, after
      # running scripts/semver_report.sh with the new version and
      # scripts/check_changelog_breaking.py on its report.
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-semver-checks@0.50.0
      # No `--release-type` argument. The script reads the release type out of the
      # tree — `core/Cargo.toml`'s version against the newest release heading below
      # it in `CHANGELOG.md` — because a type written here is a type that stays
      # behind when the version moves, which is what happened: every run said
      # "assume minor change", so the report for a patch release described a minor
      # one and skipped the 27 minor-severity lints a patch release must also pass.
      # The script then checks the type it used against the step the tool says it
      # compared, and fails if the type permitted more, so a wrong argument or a
      # baseline that moved mid-window is red rather than quiet.
      #
      # The tag path needs no different argument, and passes none: this job is
      # `if: github.event_name == 'pull_request'`, so a tag push runs no comparison
      # at all. The pull request that bumps the version is the one run that sees the
      # exact step.
      - name: Compare the public API against the published release
        run: scripts/semver_report.sh "${GITHUB_WORKSPACE}/semver-report.txt"
      # `always()` on both of the next two steps: a report is most worth having
      # when the step that produced it failed.
      - name: Publish the report to the job summary
        if: always()
        run: |
          {
            echo '## cargo-semver-checks'
            echo ''
            echo '```'
            cat "${GITHUB_WORKSPACE}/semver-report.txt" 2>/dev/null || echo '(no report was written)'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semver-checks-report
          path: semver-report.txt
          if-no-files-found: warn
      - name: Every breaking change is named in CHANGELOG.md
        run: |
          python3 scripts/check_changelog_breaking.py \
            --report "${GITHUB_WORKSPACE}/semver-report.txt"
      # Both scripts above decide whether this job is green, and both decide it
      # by reading text. These cases are what says they read it correctly — the
      # verdict-versus-exit-code distinction in particular, which is the thing
      # the old arrangement got wrong. They stub cargo and cost a second.
      - name: The two scripts' own cases
        run: |
          scripts/semver_report_test.sh
          scripts/check_changelog_breaking_test.sh

  # ── Pre-release sanity ────────────────────────────────────────────
  # Verify the publish dry-run succeeds. Catches version bumps that
  # forget to update one of the manifest fields, lockfile issues, and
  # files that should not be packaged.
  publish-dry-run:
    name: cargo publish --dry-run
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - run: cargo publish --manifest-path core/Cargo.toml --dry-run --allow-dirty

  # ── Build release artifacts ───────────────────────────────────────
  # Produces a tarball with the library artifacts (.rlib + cdylib) + license,
  # plus a sigstore-backed in-toto v1 SLSA build-provenance statement
  # (.intoto.jsonl) per artifact — verifiable with:
  #   gh attestation verify --owner <org> <artifact>
  #   cosign verify-blob-attestation <artifact>
  build-artifacts:
    name: Build release artifact (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
          key: ${{ matrix.target }}
      - name: Install aarch64-linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      # `--profile dist`, not `--release`. The two differ in one setting: `dist`
      # keeps the symbol table. A shipped cdylib is what `uniffi-bindgen
      # --library` reads to generate the four language bindings, and it finds
      # the interface by looking up `UNIFFI_META_*` symbols — which
      # `[profile.release] strip = "symbols"` removes. The 0.3.0 Linux artifacts
      # were stripped: the metadata strings were still in the binary and the
      # symbol table naming them was gone, so the generator reported no
      # namespace and there was nothing in the tarball to say why. See the
      # profile's comment in the root Cargo.toml for why this does not live in
      # `release`.
      - name: cargo build --profile dist
        run: |
          cargo build --manifest-path core/Cargo.toml --profile dist --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          NAME="phantom_protocol-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          # crate-type = ["lib", "cdylib"] — ship the .rlib (Rust consumers) AND
          # the cdylib (.so on Linux, .dylib on macOS), which is what every
          # UniFFI / C consumer links against. `core` is the root workspace's
          # only member, so cargo's target dir is the repo-root `target/`, not
          # `core/target/`. The directory is named after the profile, so it is
          # `dist/` here and not `release/`. No `|| true` on the library copies:
          # a missing library must fail the release loudly rather than ship an
          # empty tarball.
          LIBDIR="target/${{ matrix.target }}/dist"
          cp "${LIBDIR}/libphantom_protocol.rlib" "dist/${NAME}/"
          if [ -f "${LIBDIR}/libphantom_protocol.so" ]; then
            cp "${LIBDIR}/libphantom_protocol.so" "dist/${NAME}/"
          else
            cp "${LIBDIR}/libphantom_protocol.dylib" "dist/${NAME}/"
            # A Mach-O library records the path it expects to be found at, and
            # rustc writes the absolute path of the build directory into it —
            # `/Users/runner/work/.../target/.../deps/libphantom_protocol.dylib`,
            # a directory that exists on no machine but the runner. Every
            # consumer that links the shipped library then dies at launch with
            # `dyld: Library not loaded`, before `main`, and the failure names
            # the runner's path rather than anything the consumer can act on.
            # 0.3.0 shipped both macOS rows that way. `@rpath` makes the name
            # relative to whatever the consumer's own `-rpath` says, which is
            # what a redistributable dylib is supposed to carry.
            #
            # This rewrites the copy in the staging directory, so the build tree
            # is left alone. `install_name_tool` invalidates the ad-hoc
            # signature arm64 macOS requires and re-signs the file itself; the
            # check below is what proves the result still loads.
            install_name_tool -id @rpath/libphantom_protocol.dylib \
              "dist/${NAME}/libphantom_protocol.dylib"
            got="$(otool -D "dist/${NAME}/libphantom_protocol.dylib" | tail -n 1)"
            if [ "${got}" != "@rpath/libphantom_protocol.dylib" ]; then
              echo "install name is '${got}', expected '@rpath/libphantom_protocol.dylib'" >&2
              exit 1
            fi
          fi
          # The license text is not optional either: Apache-2.0 §4(a) requires
          # every redistribution, binaries included, to carry a copy, so a
          # tarball without it must not be produced at all. The README goes with
          # it on the same terms — both are tracked files at the checkout root.
          cp LICENSE "dist/${NAME}/"
          cp README.md "dist/${NAME}/"
          # Archive the files and nothing about the host they sat on. macOS tar
          # otherwise stores extended attributes (com.apple.provenance, for one)
          # as pax headers and AppleDouble `._*` members: a Linux consumer then
          # extracts a `._` twin of every file, and GNU tar warns about each
          # unknown header. COPYFILE_DISABLE stops the `._` members on macOS;
          # --no-xattrs is understood by both bsdtar and GNU tar.
          COPYFILE_DISABLE=1 tar --no-xattrs -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          # Hashed from inside `dist/`, so the digest line names the tarball by
          # its basename. `shasum -c` re-reads the path written in the file, and
          # a released pair carrying `dist/phantom_protocol-….tar.gz` verifies
          # only for someone who happens to have reproduced that directory —
          # which is nobody who downloaded the two files side by side. 0.3.0
          # shipped the prefix, so every published checksum failed in place.
          ( cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
          ( cd dist && shasum -a 256 -c "${NAME}.tar.gz.sha256" )
      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/phantom_protocol-*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phantom_protocol-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.intoto.jsonl

  # ── Create the draft GitHub Release ───────────────────────────────
  # Collects per-target artifacts and creates a draft release. Manual
  # publish step preserves a human approval gate before users see the
  # tag. To skip the manual gate, change `draft: true` to `false`.
  draft-release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-dry-run, build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      # Named for what it does. It computed nothing — the digests are written
      # beside each tarball in the job that built it, because that is the only
      # place the tarball and its name are both known.
      - name: List the collected artifacts
        run: ls -la dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.intoto.jsonl

  # ── Python wheel build + smoke test ───────────────────────────────
  # Manually triggered only (workflow_dispatch). Builds a maturin wheel that
  # bundles the cdylib + UniFFI-generated Python glue, installs it in a
  # fresh venv, and verifies `import phantom_protocol` succeeds.
  #
  # A full multi-platform cibuildwheel matrix is a documented follow-up;
  # this job proves the config is correct on a single platform.
  #
  # To publish to PyPI after this job succeeds:
  #   maturin publish --manifest-path core/Cargo.toml
  # (requires MATURIN_PYPI_TOKEN in repository secrets — not wired here).
  build-python-wheel:
    name: Build Python wheel (manual smoke test)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install maturin
        run: pip install "maturin>=1.6,<2.0"
      - name: Build wheel
        # Run from python/ so maturin picks up python/pyproject.toml, which
        # sets manifest-path, bindings = "uniffi", and python-source. maturin
        # will:
        #   1. Compile the cdylib (phantom_protocol) with --features bindings.
        #   2. Compile the uniffi-bindgen binary (auto-enables uniffi-cli).
        #   3. Run uniffi-bindgen to generate phantom_protocol.py.
        #   4. Bundle cdylib + generated .py into a platform wheel.
        # The --manifest-path in pyproject.toml is relative to the pyproject dir,
        # so we need to override here with the absolute-from-cwd form; the --out
        # flag lands the wheel in the repo-root target/wheels directory.
        #
        # `--profile dist` for the reason step 3 above gives: maturin runs
        # uniffi-bindgen against the library it just compiled, so a stripped one
        # ends the build. With `--release` this job does not produce a broken
        # wheel — it fails, `No UniFFI metadata found in …/libphantom_protocol.so`,
        # leaving a `.whl` with no `.dist-info` and nothing installable. It is
        # `workflow_dispatch`-only, which is why nothing said so. maturin's own
        # `strip = true` in python/pyproject.toml still applies and is harmless:
        # it runs on the copy it bundles, after the bindings are generated.
        run: |
          maturin build --profile dist \
            --manifest-path ../core/Cargo.toml \
            --features bindings \
            --out ../target/wheels
        working-directory: python
      - name: Verify the wheel installs, imports and works
        # `python/verify_wheel.sh` is the gate: it checks the archive's layout, installs it
        # into a throwaway virtualenv with nothing else on the path, imports it from a
        # directory holding no `phantom_protocol/` of its own, and runs a pinned loopback
        # round-trip through the installed binding. An inline `import phantom_protocol`
        # was what this step used to be, and it is the weaker half — 0.3.0 shipped a wheel
        # whose import raised `ImportError: cannot import name '__all__'`, which only an
        # install and an import from outside the source tree can see.
        #
        # `--no-build` because the step above already built the wheel with `--profile dist`;
        # the script's own build uses `--release`, which produces a wheel with no bindings
        # in it for the reason that step documents.
        run: python/verify_wheel.sh --no-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-linux-x86_64
          path: target/wheels/*.whl
          if-no-files-found: error
