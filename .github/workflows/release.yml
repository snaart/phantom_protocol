name: Release

# Two trigger surfaces:
# 1. `cargo-semver-checks` on every PR — guards against accidental
#    breaking changes in the public Rust API.
# 2. A tag push (`v*.*.*`) triggers the release pipeline:
#    publish dry-run + build release artifacts + GitHub Release draft.
on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least-privilege default for GITHUB_TOKEN; the build-artifacts and draft-release
# jobs opt into the elevated scopes they need (id-token/attestations/contents).
permissions:
  contents: read

# A release (or its PR semver check) must never be cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── SemVer hygiene ────────────────────────────────────────────────
  # `cargo-semver-checks` compares the current branch's public surface
  # against the latest published version of `phantom_protocol` on crates.io.
  # Failures here mean the PR introduces a breaking change that would
  # require a major-version bump. Run on PRs only; tag pushes are
  # post-bump and so are expected to legitimately change the API.
  semver-checks:
    name: cargo-semver-checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Need full history so cargo-semver-checks can locate the
          # previous tagged release.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        # The crate is not yet published to crates.io, so there is no baseline
        # to diff the public API against — the action errors with "not found in
        # registry". Keep the check visible but non-blocking during pre-1.0
        # iteration; it becomes a hard gate once the first version ships.
        continue-on-error: true
        with:
          manifest-path: core/Cargo.toml
          release-type: minor

  # ── Pre-release sanity ────────────────────────────────────────────
  # Verify the publish dry-run succeeds. Catches version bumps that
  # forget to update one of the manifest fields, lockfile issues, and
  # files that should not be packaged.
  publish-dry-run:
    name: cargo publish --dry-run
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - run: cargo publish --manifest-path core/Cargo.toml --dry-run --allow-dirty

  # ── Build release artifacts ───────────────────────────────────────
  # Produces a tarball with the static library + license, plus a
  # sigstore-backed in-toto v1 SLSA build-provenance statement
  # (.intoto.jsonl) per artifact — verifiable with:
  #   gh attestation verify --owner <org> <artifact>
  #   cosign verify-blob-attestation <artifact>
  build-artifacts:
    name: Build release artifact (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
          key: ${{ matrix.target }}
      - name: Install aarch64-linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - name: cargo build --release
        run: |
          cargo build --manifest-path core/Cargo.toml --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          NAME="phantom_protocol-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          # The crate is a library — ship the .rlib + headers + license.
          # For dynamic library variants this would also copy .so/.dylib;
          # phantom_protocol is statically linked, so .rlib is sufficient.
          cp core/target/${{ matrix.target }}/release/*.rlib "dist/${NAME}/" 2>/dev/null || true
          cp LICENSE "dist/${NAME}/" 2>/dev/null || true
          cp README.md "dist/${NAME}/" 2>/dev/null || true
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          shasum -a 256 "dist/${NAME}.tar.gz" > "dist/${NAME}.tar.gz.sha256"
      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/phantom_protocol-*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phantom_protocol-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.intoto.jsonl

  # ── Create the draft GitHub Release ───────────────────────────────
  # Collects per-target artifacts and creates a draft release. Manual
  # publish step preserves a human approval gate before users see the
  # tag. To skip the manual gate, change `draft: true` to `false`.
  draft-release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-dry-run, build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Compute checksums
        run: |
          cd dist
          ls -la
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.intoto.jsonl
