name: Release

# Two trigger surfaces:
# 1. `cargo-semver-checks` on every PR — produces the list of public Rust API
#    breaks against the published release, and requires each one to be written
#    down in CHANGELOG.md before the PR lands.
# 2. A tag push (`v*.*.*`) triggers the release pipeline:
#    publish dry-run + build release artifacts + GitHub Release draft.
on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*.*.*'
  # Manual trigger for the Python wheel smoke-test job. Does not trigger on
  # every push; run from the GitHub Actions "Run workflow" button.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least-privilege default for GITHUB_TOKEN; the build-artifacts and draft-release
# jobs opt into the elevated scopes they need (id-token/attestations/contents).
permissions:
  contents: read

# A release (or its PR semver check) must never be cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── SemVer hygiene ────────────────────────────────────────────────
  # `cargo-semver-checks` compares this branch's public surface against the
  # latest `phantom-protocol` published on crates.io, and the comparison is
  # kept: written to the job summary and uploaded as an artifact, so the list
  # of what broke exists while the change is being reviewed rather than being
  # reconstructed on release day.
  #
  # What fails this job, and what does not. A 0.x crate is allowed to break its
  # Rust API between minors, so the tool *finding* breakage is not a failure —
  # it is a fact to record. Two things are failures: a run that could not
  # compare anything, and a break that nobody wrote down. The first is caught by
  # `scripts/semver_report.sh` (which insists on a verdict line rather than
  # trusting the exit code), the second by `scripts/check_changelog_breaking.py`.
  #
  # This replaces a `continue-on-error: true` step that had never compared
  # anything: with no feature flags the tool enables every feature it does not
  # recognise as exotic, which for this crate means `fips` and `no-std`
  # together, which `core/src/lib.rs` rejects with a `compile_error!`. The run
  # died building rustdoc for the current crate and exited non-zero — the same
  # non-zero a genuine finding produces, and swallowed the same way. See
  # `scripts/semver_report.sh` for the feature set that does build and for what
  # it still cannot see.
  semver-checks:
    name: cargo-semver-checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # No `fetch-depth: 0`: the baseline is the crate published on crates.io,
      # resolved through the registry, and no step here passes `--baseline-rev`.
      # Git history supplied nothing to this job.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      # A prebuilt binary rather than `obi1kenobi/cargo-semver-checks-action`:
      # that action runs the tool itself and leaves the output only in the job
      # log, and the report is the deliverable here. `taiki-e/install-action` is
      # already the installer this repository uses for cargo-fuzz.
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2
        with:
          tool: cargo-semver-checks
      - name: Compare the public API against the published release
        run: scripts/semver_report.sh "${GITHUB_WORKSPACE}/semver-report.txt"
      # `always()` on both of the next two steps: a report is most worth having
      # when the step that produced it failed.
      - name: Publish the report to the job summary
        if: always()
        run: |
          {
            echo '## cargo-semver-checks'
            echo ''
            echo '```'
            cat "${GITHUB_WORKSPACE}/semver-report.txt" 2>/dev/null || echo '(no report was written)'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semver-checks-report
          path: semver-report.txt
          if-no-files-found: warn
      - name: Every breaking change is named in CHANGELOG.md
        run: |
          python3 scripts/check_changelog_breaking.py \
            --report "${GITHUB_WORKSPACE}/semver-report.txt"
      # Both scripts above decide whether this job is green, and both decide it
      # by reading text. These cases are what says they read it correctly — the
      # verdict-versus-exit-code distinction in particular, which is the thing
      # the old arrangement got wrong. They stub cargo and cost a second.
      - name: The two scripts' own cases
        run: |
          scripts/semver_report_test.sh
          scripts/check_changelog_breaking_test.sh

  # ── Pre-release sanity ────────────────────────────────────────────
  # Verify the publish dry-run succeeds. Catches version bumps that
  # forget to update one of the manifest fields, lockfile issues, and
  # files that should not be packaged.
  publish-dry-run:
    name: cargo publish --dry-run
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - run: cargo publish --manifest-path core/Cargo.toml --dry-run --allow-dirty

  # ── Build release artifacts ───────────────────────────────────────
  # Produces a tarball with the library artifacts (.rlib + cdylib) + license,
  # plus a sigstore-backed in-toto v1 SLSA build-provenance statement
  # (.intoto.jsonl) per artifact — verifiable with:
  #   gh attestation verify --owner <org> <artifact>
  #   cosign verify-blob-attestation <artifact>
  build-artifacts:
    name: Build release artifact (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
          key: ${{ matrix.target }}
      - name: Install aarch64-linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - name: cargo build --release
        run: |
          cargo build --manifest-path core/Cargo.toml --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          NAME="phantom_protocol-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          # crate-type = ["lib", "cdylib"] — ship the .rlib (Rust consumers) AND
          # the cdylib (.so on Linux, .dylib on macOS), which is what every
          # UniFFI / C consumer links against. `core` is the root workspace's
          # only member, so cargo's target dir is the repo-root `target/`, not
          # `core/target/`. No `|| true` on the library copies: a missing library
          # must fail the release loudly rather than ship an empty tarball.
          LIBDIR="target/${{ matrix.target }}/release"
          cp "${LIBDIR}/libphantom_protocol.rlib" "dist/${NAME}/"
          if [ -f "${LIBDIR}/libphantom_protocol.so" ]; then
            cp "${LIBDIR}/libphantom_protocol.so" "dist/${NAME}/"
          else
            cp "${LIBDIR}/libphantom_protocol.dylib" "dist/${NAME}/"
          fi
          cp LICENSE "dist/${NAME}/" 2>/dev/null || true
          cp README.md "dist/${NAME}/" 2>/dev/null || true
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          shasum -a 256 "dist/${NAME}.tar.gz" > "dist/${NAME}.tar.gz.sha256"
      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/phantom_protocol-*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phantom_protocol-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.intoto.jsonl

  # ── Create the draft GitHub Release ───────────────────────────────
  # Collects per-target artifacts and creates a draft release. Manual
  # publish step preserves a human approval gate before users see the
  # tag. To skip the manual gate, change `draft: true` to `false`.
  draft-release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-dry-run, build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Compute checksums
        run: |
          cd dist
          ls -la
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.intoto.jsonl

  # ── Python wheel build + smoke test ───────────────────────────────
  # Manually triggered only (workflow_dispatch). Builds a maturin wheel that
  # bundles the cdylib + UniFFI-generated Python glue, installs it in a
  # fresh venv, and verifies `import phantom_protocol` succeeds.
  #
  # A full multi-platform cibuildwheel matrix is a documented follow-up;
  # this job proves the config is correct on a single platform.
  #
  # To publish to PyPI after this job succeeds:
  #   maturin publish --manifest-path core/Cargo.toml
  # (requires MATURIN_PYPI_TOKEN in repository secrets — not wired here).
  build-python-wheel:
    name: Build Python wheel (manual smoke test)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install maturin
        run: pip install "maturin>=1.6,<2.0"
      - name: Build wheel
        # Run from python/ so maturin picks up python/pyproject.toml, which
        # sets manifest-path, bindings = "uniffi", and python-source. maturin
        # will:
        #   1. Compile the cdylib (phantom_protocol) with --features bindings.
        #   2. Compile the uniffi-bindgen binary (auto-enables uniffi-cli).
        #   3. Run uniffi-bindgen to generate phantom_protocol.py.
        #   4. Bundle cdylib + generated .py into a platform wheel.
        # The --manifest-path in pyproject.toml is relative to the pyproject dir,
        # so we need to override here with the absolute-from-cwd form; the --out
        # flag lands the wheel in the repo-root target/wheels directory.
        run: |
          maturin build --release \
            --manifest-path ../core/Cargo.toml \
            --features bindings \
            --out ../target/wheels
        working-directory: python
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/phantom-smoke-venv
          /tmp/phantom-smoke-venv/bin/pip install --no-index --find-links target/wheels phantom-protocol
          /tmp/phantom-smoke-venv/bin/python -c "import phantom_protocol; print(getattr(phantom_protocol, '__doc__', None) or 'import OK')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-linux-x86_64
          path: target/wheels/*.whl
          if-no-files-found: error
