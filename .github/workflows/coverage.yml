name: coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    name: cargo llvm-cov (line coverage)
    runs-on: ubuntu-latest
    # Line coverage on stable. Branch coverage needs nightly's
    # `-Z coverage-options=branch`, and on the nightly LLVM `llvm-cov export`
    # crashes (upstream LLVM bug) while merging the profile across this crate's
    # object set — so we stay on stable's mature llvm-cov and report lines only.
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (llvm-tools-preview)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: coverage
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage report
        # `--workspace` would also include cli/tests siblings — we want
        # only the `core` crate.
        run: |
          cargo llvm-cov \
              --manifest-path core/Cargo.toml \
              --lib --tests \
              --lcov \
              --output-path lcov.info
      - name: Coverage summary
        run: |
          cargo llvm-cov \
              --manifest-path core/Cargo.toml \
              --lib --tests \
              --summary-only
      - name: Upload to Codecov
        # Soft-fail: a missing CODECOV_TOKEN should not break CI.
        uses: codecov/codecov-action@v5
        if: ${{ env.CODECOV_TOKEN != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
