name: coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least-privilege default for GITHUB_TOKEN.
permissions:
  contents: read

# Cancel superseded in-progress runs on PR branches; never cancel a main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  coverage:
    name: cargo llvm-cov (line coverage)
    runs-on: ubuntu-latest
    # Line coverage on stable. Branch coverage needs nightly's
    # `-Z coverage-options=branch`, and on the nightly LLVM `llvm-cov export`
    # crashes (upstream LLVM bug) while merging the profile across this crate's
    # object set — so we stay on stable's mature llvm-cov and report lines only.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust toolchain (llvm-tools-preview)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
          key: coverage
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage report
        # `--workspace` would also include cli/tests siblings — we want
        # only the `core` crate.
        run: |
          cargo llvm-cov \
              --manifest-path core/Cargo.toml \
              --lib --tests \
              --lcov \
              --output-path lcov.info
      - name: Coverage summary
        run: |
          cargo llvm-cov \
              --manifest-path core/Cargo.toml \
              --lib --tests \
              --summary-only
      - name: Upload to Codecov
        # Soft-fail: a missing CODECOV_TOKEN should not break CI.
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        if: ${{ env.CODECOV_TOKEN != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
