name: coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    name: cargo llvm-cov (lines + branches)
    runs-on: ubuntu-latest
    # The repo's rust-toolchain.toml pins `channel = "stable"`, which otherwise
    # overrides the nightly install below and makes `-Z coverage-options=branch`
    # fail ("only accepted on the nightly compiler"). RUSTUP_TOOLCHAIN outranks
    # rust-toolchain.toml, so it forces every cargo/rustc call onto nightly.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (llvm-tools-preview)
        # Branch coverage (`cargo llvm-cov --branch`) needs the nightly-only
        # `-Z coverage-options=branch`, so this job runs on nightly.
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: coverage
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage report
        # `--workspace` would also include cli/tests siblings — we want
        # only the `core` crate.
        run: |
          cargo llvm-cov \
              --manifest-path core/Cargo.toml \
              --lib --tests \
              --branch \
              --lcov \
              --output-path lcov.info
      - name: Coverage summary
        run: |
          cargo llvm-cov \
              --manifest-path core/Cargo.toml \
              --lib --tests \
              --branch \
              --summary-only
      - name: Upload to Codecov
        # Soft-fail: a missing CODECOV_TOKEN should not break CI.
        uses: codecov/codecov-action@v5
        if: ${{ env.CODECOV_TOKEN != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
