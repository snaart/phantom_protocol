name: miri

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Sunday 03:00 UTC — miri is slow, no need to run on every PR
    # for the full suite; the trimmed scope below is fast enough to run
    # on each PR too.
    - cron: "0 3 * * 0"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least-privilege default for GITHUB_TOKEN.
permissions:
  contents: read

# Cancel superseded in-progress runs on PR branches; never cancel a main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Miri is the Rust mid-level-IR interpreter. It catches:
# - Undefined behavior (out-of-bounds, uninitialized memory, aliasing
#   violations, mis-aligned references, ...).
# - Data races (under the `-Zmiri-disable-isolation` flag).
# - Memory leaks (`-Zmiri-disable-isolation` + symbol resolution).
#
# It cannot run tests that rely on the OS or async runtimes (no syscalls,
# no real time, no thread scheduling). We therefore scope to the
# synchronous unit tests in modules that have NO tokio dependency.

jobs:
  miri:
    name: cargo miri test (synchronous suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install nightly toolchain with miri
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
          key: miri
      - name: cargo miri setup
        run: cargo +nightly miri setup
      - name: cargo miri test (filtered)
        # Run only the synchronous, pure-Rust test modules. Tokio-heavy tests
        # would need `-Zmiri-disable-isolation` + simulated syscalls, and the
        # `adaptive_crypto` round-trips call into `ring`'s hand-written assembly
        # (`OPENSSL_cpuid_setup`), which miri cannot execute — both are out of
        # scope. The replay-window and wire-codec modules are exactly the
        # provenance/alignment-sensitive code miri is here to check.
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-symbolic-alignment-check"
        run: |
          cargo +nightly miri test --manifest-path core/Cargo.toml --lib -- \
              security::replay_window \
              transport::types::tests
