name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

# Least-privilege default for GITHUB_TOKEN; jobs opt into more where they need
# it (e.g. the audit job below requests `checks: write`).
permissions:
  contents: read

# Cancel superseded in-progress runs on PR branches; never cancel a main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Pinned (not @stable): rustfmt's default style is version-sensitive, so a
      # stable bump can flip this red with no code change. Pin to the toolchain
      # the tree is formatted against and bump deliberately. (test/clippy stay on
      # @stable so they keep catching new lints.)
      - uses: dtolnay/rust-toolchain@b1b44fef029483cc79808c5eb89461241fd8f32f # 1.93.0
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path core/Cargo.toml --check
      # The sibling crates are not workspace members, so `core`'s check never
      # saw them and both had drifted from the repo-root `.rustfmt.toml`.
      - run: cargo fmt --manifest-path server/Cargo.toml --check
      - run: cargo fmt --manifest-path cli/Cargo.toml --check
      # The testbed is the third sibling and had drifted for the same reason.
      # It stays in this job rather than in `testbed-check` so it gets the
      # pinned rustfmt above; every other testbed gate runs on stable.
      - run: cargo fmt --manifest-path testbed/Cargo.toml --check

  clippy:
    # NOTE: "warn-only" in this `name:` is legacy wording — the audit lints are
    # `deny` in core/src/lib.rs and the file-scope `RUSTFLAGS: -D warnings`
    # makes this a hard gate. The string is kept verbatim because it is a pinned
    # branch-protection required-status-check context — renaming it makes the
    # required context never report and blocks every merge (same rule as the
    # `integration` job below).
    name: cargo clippy (audit lints, warn-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      # The audit lints (`clippy::unwrap_used`, `expect_used`, `panic`,
      # `unreachable`, `todo`, `unimplemented`, `missing_safety_doc`) are
      # `deny` at the crate root (core/src/lib.rs) — every surviving production
      # panic-shaped call carries an inline `// PANIC-SAFETY:` comment plus a
      # statement-scoped `#[allow(...)]` (inventory: docs/security/panic-sites.md).
      # `clippy::indexing_slicing` is deliberately NOT enabled (too noisy on
      # constant-bounded indexing). With the file-scope `RUSTFLAGS: -D warnings`
      # above, any remaining warning is a hard failure — this job is a gate.
      - run: cargo clippy --manifest-path core/Cargo.toml --lib
      # `--lib` compiles ONE target: the production library WITHOUT `cfg(test)`.
      # It never builds the in-lib `#[cfg(test)]` modules, `core/tests/`,
      # `core/benches/` or `core/examples/` — which is exactly how a
      # non-compiling example and 267 findings (263 warnings + 4 `never_loop`
      # errors) accumulated in this tree unnoticed while this job stayed green.
      # `--all-targets` builds the lib a second time WITH `cfg(test)` plus every
      # integration test, bench and example, so that debt cannot silently
      # return. It reuses the artifacts the `--lib` step above just produced, so
      # keeping that step costs almost nothing and preserves a fast, precise,
      # production-code-only first failure.
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - run: cargo test --manifest-path core/Cargo.toml --lib
      # Formal negative-security tests pinning the documented invariants (server
      # pinning, AEAD/AAD binding, replay, rekey, flow-control, and the PhantomUDP
      # pre-auth DoS bounds). Always-on; a regression surfaces as a hard red here.
      - run: cargo test --manifest-path core/Cargo.toml --test security_invariants
      # Byte-exact wire-format freeze. Always-on integration test; gates any
      # accidental on-wire byte change. The lib run above already covers the
      # transcript-hash vector (transport::handshake::tests).
      - run: cargo test --manifest-path core/Cargo.toml --test wire_vectors
      # Independent (non-Rust) decoder over the same fixtures — cross-impl interop.
      - run: python3 tests/wire_vectors_decode.py
      # Real NIST ACVP KAT vectors for ML-KEM-768 / ML-DSA-65 — catches a PQ
      # crate-encoding regression that a self-referential round-trip cannot.
      - run: cargo test --manifest-path core/Cargo.toml --test nist_kat
      # End-to-end observability wiring: a real TCP session must populate the
      # handshake/packet/byte metrics, the encrypt/decrypt timings and the RTT
      # sample, and drive the active-session AND active-stream gauges up and
      # back down (including on an abnormal close). Runs on the default
      # (no-otel) atomics path.
      - run: cargo test --manifest-path core/Cargo.toml --test observability_e2e
      # Facade-level contracts the recording call sites depend on (gauge
      # balance, sum-over-count averages, per-path RTT slots, and the pin that
      # the OTel-only recorders touch no atomic).
      - run: cargo test --manifest-path core/Cargo.toml --test observability_atomics
      # The suites below were in the tree but in no workflow, so a regression in
      # any of them reached main green. They are all fast — the six together run
      # in about seven seconds against artifacts the steps above have already
      # built — so they belong in this job rather than in one of their own.
      #
      # proptest over the AEAD round trip and its AAD-mismatch rejection, the
      # replay window's monotonic-accept / duplicate-reject pair, and the wire
      # codec's refusal to panic on arbitrary bytes. Randomised where the fixed
      # vectors above are not, which is the point of having both.
      - run: cargo test --manifest-path core/Cargo.toml --test property
      # CAVP-style known-answer vectors for AES-256-GCM, HKDF-SHA256 (RFC 5869
      # A.1) and SHA-256, plus ML-KEM-768 / ML-DSA-65 round trips. The fips job
      # runs this suite under the aws-lc-rs substrate; nothing ran it under the
      # default ring/RustCrypto one, which is the substrate that ships.
      - run: cargo test --manifest-path core/Cargo.toml --test cavp
      # PacketHeader to_wire/from_wire round trip, the 15-byte SIZE, and the
      # version-first byte order.
      - run: cargo test --manifest-path core/Cargo.toml --test check_wire
      # Pins that the `Runtime` trait is a real seam: a substituted runtime must
      # actually drive both a session and a listener. Untested, the indirection
      # can be bypassed at one call site and the embedded / WASI runtimes stop
      # being reachable without anything failing.
      - run: cargo test --manifest-path core/Cargo.toml --test runtime_integration
      # The no-telemetry path: recording still compiles, the atomics still
      # count, and `PhantomInstruments` is still a ZST. This is the default
      # build's observability behaviour, and the only job that touched
      # observability under a feature flag was the one that turns the flag on.
      - run: cargo test --manifest-path core/Cargo.toml --test observability_no_otel
      # Randomised rejection of malformed and garbage ClientHellos against
      # `process_client_hello`. The cargo-fuzz targets cover the same parser far
      # harder, but they run in their own nightly workflow and are not a
      # required context; this is the always-on floor.
      - run: cargo test --manifest-path core/Cargo.toml --test fuzz_handshake
      # `observability_instrument_wiring` is deliberately NOT here. Its whole
      # file is `#![cfg(feature = "telemetry-otel")]`, so a step in this job
      # would compile an empty binary and report "0 passed" — a green tick for
      # nothing run. It is gated in the `telemetry-otel-feature` job, which is
      # where the instruments it pins actually exist.

  # MSRV gate (M-8): the crate documents a Rust 1.93 MSRV (rust-version /
  # .clippy.toml / docs/policy/versioning.md) but nothing enforced it. Pin the
  # toolchain to 1.93 and `cargo check` the configurations that claim it — the
  # default lib and the embedded/no-std bare-metal path — so a dependency that
  # bumps its MSRV past 1.93 can't silently break an integrator. (The MSRV was
  # raised from 1.75: pkcs8 0.11 via the PQ crates needs edition2024 / Rust 1.85.)
  msrv:
    name: cargo check (MSRV 1.93)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action; 1.93 via input
        with:
          toolchain: "1.93"
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - run: cargo +1.93 check --manifest-path core/Cargo.toml --lib --locked
      - run: cargo +1.93 check --manifest-path core/Cargo.toml --lib --no-default-features --features embedded,no-std --target thumbv7em-none-eabihf --locked

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Pinned for the same reason as the fmt job: rustdoc's `-D warnings` set is
      # version-sensitive, so a stable bump can introduce new lints and flip this
      # red with no code change. Pin and bump deliberately.
      - uses: dtolnay/rust-toolchain@b1b44fef029483cc79808c5eb89461241fd8f32f # 1.93.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - run: cargo doc --manifest-path core/Cargo.toml --no-deps --lib
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Check for UTF-8 mojibake in docs
        run: |
          if grep -rPl '\xc3\xa2\xc2|\xc3\x82\xc2\xb1' docs/ 2>/dev/null | grep -q .; then
            echo "UTF-8 mojibake detected in docs/ - run the mojibake repair script"
            grep -rPl '\xc3\xa2\xc2|\xc3\x82\xc2\xb1' docs/
            exit 1
          fi

  panic-sites:
    # The inventory in docs/security/panic-sites.md is the entry point for an
    # adversarial review, and it had drifted a whole row out of step with the
    # code while every one of its stream.rs addresses pointed somewhere else.
    # A document nobody can trust is worse than no document, so the agreement
    # is now machine-checked. No toolchain needed — it is a text scan.
    name: panic-site inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: scripts/check_panic_sites.py

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          # Use the action's dedicated `manifest-path` input — passing
          # `--manifest-path` inside `arguments` collides with the flag the
          # action already injects ("cannot be used multiple times"). Scan every
          # feature's dependency graph (fips / telemetry-otel / embedded), not
          # just the default set.
          manifest-path: core/Cargo.toml
          arguments: --all-features

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # The repo's default workflow token is read-only; rustsec/audit-check posts
    # its findings as a check-run, which needs `checks: write`. Without this the
    # job fails with "Resource not accessible by integration" even when the
    # audit itself is clean.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  audit-binaries:
    name: cargo audit (server + cli lockfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - run: cargo install cargo-audit --locked
      # The deployed `server`/`cli` binaries carry their own committed
      # lockfiles. The root `audit` job above does not see them, so
      # scan them explicitly — release artifacts build from these trees.
      #
      # (The job's display name still says "server + cli" while three lockfiles
      # are scanned. It is a pinned branch-protection required-status-check
      # context: renaming it makes the required context never report and blocks
      # every merge, so the string is left alone — same rule as the
      # `integration` job below.)
      - run: cargo audit -f server/Cargo.lock
      - run: cargo audit -f cli/Cargo.lock
      # The testbed is also a deployed binary — `phantom-testd` runs as a
      # service on a public VPS — and it pulls the widest third-party tree in
      # the repository (quinn, rustls, rcgen). It had no advisory scan at all.
      - run: cargo audit -f testbed/Cargo.lock

  embedded-feature:
    name: cargo test + clippy (--features embedded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - run: cargo test --manifest-path core/Cargo.toml --lib --features embedded
      - run: cargo clippy --manifest-path core/Cargo.toml --lib --features embedded -- -D warnings
      # `--lib` above never builds `core/examples/` nor the leg's own
      # `#[cfg(test)]` module, so both could rot unnoticed — an
      # `embedded-io-async` trait bump once left `embedded_demo` (the only
      # example needing this feature) failing to compile, and a `never_loop`
      # error plus a `type_complexity` warning had since accumulated in exactly
      # those two blind spots. `--all-targets` compiles AND lints the examples,
      # tests and benches, so it strictly subsumes the `cargo check --examples`
      # step it replaces here.
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets --features embedded -- -D warnings

  mimicry-feature:
    name: cargo test + clippy (--features mimicry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - run: cargo test --manifest-path core/Cargo.toml --lib --features mimicry
      - run: cargo clippy --manifest-path core/Cargo.toml --lib --features mimicry -- -D warnings
      # Widened for the same reason as the main `clippy` job: `--lib` never sees
      # the leg's own `#[cfg(test)]` modules (`record.rs`, `client_hello.rs`) or
      # `core/tests/mimic_tls_integration.rs`, and three lint findings had
      # collected there unnoticed.
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets --features mimicry -- -D warnings
      # Live end-to-end loopback: bind_mimic ↔ connect_pinned_mimic, full prelude +
      # inner PQ handshake + bidirectional data (the leg's own #[ignore] live tests
      # ride in --lib above but are not executed without --ignored).
      - run: cargo test --manifest-path core/Cargo.toml --features mimicry --test mimic_tls_integration -- --ignored
      - run: cargo test --manifest-path core/Cargo.toml --features mimicry --lib mimic_tls::leg -- --ignored

  telemetry-otel-feature:
    name: cargo test + clippy (--features telemetry-otel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - run: cargo test --manifest-path core/Cargo.toml --lib --features telemetry-otel
      - run: cargo test --manifest-path core/Cargo.toml --test observability_otel --features telemetry-otel
      # Regression pins for the seven OTel-ONLY recorders (cookie / pow /
      # early_data / resumption / rekey / path_migration / path_validation).
      # They touch no atomic, so `Observability::snapshot()` can never show
      # them — this suite installs an in-memory SdkMeterProvider, drives real
      # loopback code paths, and asserts the counter series actually moved.
      # Only meaningful under this feature (the instruments are a ZST no-op
      # otherwise), which is why it lives in this job.
      - run: cargo test --manifest-path core/Cargo.toml --test observability_instrument_wiring --features telemetry-otel
      - run: cargo clippy --manifest-path core/Cargo.toml --lib --features telemetry-otel -- -D warnings
      # `--lib` does not lint `core/tests/observability_otel.rs` or
      # `observability_instrument_wiring.rs` — the two suites this job exists to
      # run, and the only place the OTel-only recorders are exercised at all.
      # `--all-targets` covers them (plus `observability_bench`, whose OTel path
      # nothing else compiles under this feature).
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets --features telemetry-otel -- -D warnings

  fips-feature:
    name: cargo test + clippy (--features fips)
    runs-on: ubuntu-latest
    # `aws-lc-rs` is best-supported on Linux. macOS / Windows are
    # documented (CONTRIBUTING.md: `brew install pkg-config openssl@3`)
    # but the CI runner of record is ubuntu-latest.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      # aws-lc-rs needs cmake + a C toolchain. ubuntu-latest already
      # ships gcc; install cmake explicitly.
      - run: sudo apt-get update && sudo apt-get install -y cmake
      # `--no-default-features` drops the `default` feature (and with it
      # `classical-crypto`), so the FIPS build links neither `ring` nor
      # `x25519-dalek` — the AEAD routes through `aws-lc-rs` and the
      # classical KEM half through ECDH-P-256 (SUPPLY-03). `bindings`
      # restores the UniFFI surface that `default` would otherwise carry.
      - run: cargo test --manifest-path core/Cargo.toml --no-default-features --features fips,bindings,compression-zstd --lib
      - run: cargo test --manifest-path core/Cargo.toml --no-default-features --features fips,bindings,compression-zstd --test cavp
      - run: cargo test --manifest-path core/Cargo.toml --no-default-features --features fips,bindings,compression-zstd --test nist_kat
      - run: cargo clippy --manifest-path core/Cargo.toml --no-default-features --features fips,bindings,compression-zstd --lib -- -D warnings
      # `--lib` misses every test target this feature set still compiles —
      # including the `cavp` / `nist_kat` suites run above and the in-lib
      # `#[cfg(test)]` modules, whose fips-only branches nothing else lints.
      # Verified clean when this gate was added; keeps them from rotting.
      - run: cargo clippy --manifest-path core/Cargo.toml --no-default-features --features fips,bindings,compression-zstd --all-targets -- -D warnings
      # Supply-chain guard (SUPPLY-03): the FIPS build must NOT link the
      # non-FIPS `ring` / `x25519-dalek` crates. `cargo tree -i` exits
      # non-zero ("did not match any packages") when the crate is absent,
      # which is exactly the success condition here.
      - name: assert ring + x25519-dalek absent from the fips dep graph
        run: |
          set +e
          cargo tree --manifest-path core/Cargo.toml --no-default-features --features fips,bindings,compression-zstd -i ring >/dev/null 2>&1
          ring_rc=$?
          cargo tree --manifest-path core/Cargo.toml --no-default-features --features fips,bindings,compression-zstd -i x25519-dalek >/dev/null 2>&1
          x25519_rc=$?
          set -e
          if [ "$ring_rc" -eq 0 ]; then
            echo "::error::ring is linked in the fips build — SUPPLY-03 regressed (classical-crypto leaked into the fips path)"
            exit 1
          fi
          if [ "$x25519_rc" -eq 0 ]; then
            echo "::error::x25519-dalek is linked in the fips build — SUPPLY-03 regressed"
            exit 1
          fi
          echo "ok: neither ring nor x25519-dalek is in the fips dependency graph"
      # Confirm the fips × no-std conflict guard fires loudly rather
      # than silently producing a broken binary.
      - name: assert fips + no-std is rejected
        run: |
          set +e
          out=$(cargo check --manifest-path core/Cargo.toml --features fips,no-std 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::fips + no-std build unexpectedly succeeded — the compile_error guard in core/src/lib.rs is broken"
            exit 1
          fi
          echo "$out" | grep -q "mutually exclusive" || {
            echo "::error::fips + no-std build failed, but not with the expected mutual-exclusion message:"
            echo "$out"
            exit 1
          }

  cli-check:
    name: cli compiles against core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      - run: cargo check --manifest-path cli/Cargo.toml
      # The CLI is a shipped, operator-facing artifact (it writes long-term
      # signing keys), but it was the one crate in the tree with no lint gate at
      # all — `server-check` has linted with `--all-targets` all along, and this
      # job only ever ran `cargo check`. A `collapsible_if` in `keygen.rs` had
      # accumulated there unnoticed as a result. Mirror the server job.
      - run: cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings

  server-check:
    name: server compiles + tests against core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      # The reference server is a deployed artifact; keep it building + linting
      # against the current core. `--all-targets` also compiles its unit tests
      # (the admission-control limiter), which the test run then executes.
      - run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path server/Cargo.toml
      # Startup smoke: the unit tests don't exercise `main()`, so a runtime
      # startup regression (e.g. a missing OTLP feature, a broken self-test)
      # would ship silently. Boot the binary against a DEAD OTLP collector,
      # assert it runs the POST, binds, and exits cleanly on SIGTERM.
      - name: server startup smoke (dead OTLP collector)
        run: |
          set -euo pipefail
          cargo build --manifest-path server/Cargo.toml --bin phantom-server
          BIN=server/target/debug/phantom-server
          RUST_LOG=info "$BIN" --bind 127.0.0.1:14242 \
            --otlp-endpoint http://127.0.0.1:1 \
            --signing-key-file "$(mktemp -u)" >/tmp/srv.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/14242) 2>/dev/null && { exec 3>&-; break; }
            kill -0 "$PID" 2>/dev/null || { echo "::error::server died on startup"; cat /tmp/srv.log; exit 1; }
            sleep 0.5
          done
          (exec 3<>/dev/tcp/127.0.0.1/14242) 2>/dev/null || { echo "::error::server never bound"; cat /tmp/srv.log; kill "$PID" 2>/dev/null||true; exit 1; }; exec 3>&-
          grep -q "power-on self-test passed" /tmp/srv.log || { echo "::error::POST did not run"; cat /tmp/srv.log; kill "$PID" 2>/dev/null||true; exit 1; }
          kill -TERM "$PID"
          for i in $(seq 1 20); do kill -0 "$PID" 2>/dev/null || break; sleep 0.5; done
          if kill -0 "$PID" 2>/dev/null; then echo "::error::no clean SIGTERM exit"; kill -9 "$PID"; exit 1; fi
          wait "$PID" || true
          echo "server startup smoke OK"

  testbed-check:
    # Every performance number this project reports — in CHANGELOG.md, in the
    # README, in the articles — comes out of `testbed/`, and the crate was in no
    # workflow at all: no lint, no test run, no build, no advisory scan of its
    # lockfile. An instrument nobody checks is how a measurement campaign ends
    # up arguing about the instrument, and this one had already shipped
    # unformatted and with a failing test without anything noticing.
    #
    # `testbed/` is a sibling crate with its own `[workspace]`, so nothing in
    # the core manifest reaches it — every step names its manifest explicitly.
    # (`cargo fmt --check` for it lives in the `fmt` job above, which pins
    # rustfmt's version deliberately.)
    name: testbed compiles + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
          key: testbed
      # `--all-targets` from the start: the crate is two binaries plus a library
      # of shared measurement code, and a `--lib`-only lint would leave the
      # binaries — the parts that actually run on the VPS — unlinted.
      - run: cargo clippy --manifest-path testbed/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path testbed/Cargo.toml
      # The deployed artifact is the release build, and it is the only
      # configuration the WAN campaign ever runs. A debug-only gate would let a
      # release-only break — an overflow check, a profile-gated dependency —
      # reach the VPS and be discovered as a bad measurement.
      - run: cargo build --manifest-path testbed/Cargo.toml --release

  integration:
    # NOTE: this `name:` is a pinned branch-protection **required status check**
    # context — do NOT rename it (a rename makes the required context never report
    # and blocks every merge). The job covers tcp + udp loopback (kcp was dropped
    # long ago); the legacy "kcp" wording is kept only to match the required context.
    name: tcp + kcp loopback integration
    runs-on: ubuntu-latest
    # Outer guard: even if an in-test deadlock-timeout somehow fails to fire,
    # GitHub kills the job rather than burning a 6-hour runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
      # Real-network loopback gates that previously had no automated coverage:
      #   - TCP: server-key pinning (positive + negative) and on-the-wire AES-GCM
      #     (the test sniffs raw bytes and asserts plaintext never appears),
      #     plus a 0-RTT resumption round-trip.
      # The file is `#[ignore]`-gated so it stays out of the default
      # `cargo test`; this dedicated job runs it with --ignored (mirroring the
      # wasi_integration job).
      - run: cargo test --manifest-path core/Cargo.toml --test tcp_integration -- --ignored
      # UDP loopback gate (audit EPS-03, 2026-06-15): the PhantomUDP suite —
      # including the on-wire CID-rotation test that pins ε's unlinkable migration
      # (`set_outbound_cid` reaching the inner transport through the pump's
      # ObservedTransport) — was `#[ignore]`-gated with NO runner, so a regression
      # to a vacuous, linkable `migrate()` would pass a fully green pipeline. Run
      # it here, mirroring the tcp_integration gate above.
      - run: cargo test --manifest-path core/Cargo.toml --test udp_integration -- --ignored
