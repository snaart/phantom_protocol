name: cross-platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# This workflow only verifies that `phantom_core` *compiles* on each target —
# we do not run tests here because most targets cannot run unit tests on a
# GitHub-Actions hosted runner (cross-toolchain limitations, no QEMU, no
# browser sandbox). The CI matrix in `ci.yml` runs the full test suite on
# x86_64-unknown-linux-gnu.
#
# Each "compile-check" matrix entry is intentionally `cargo check` (not
# `cargo build`) so the job is fast and CI doesn't pay link time. The
# `--lib` target keeps the focus on the library; binaries / tests / examples
# may require target-specific code paths that are not yet ported.

jobs:
  compile-check:
    name: cargo check (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux server / mobile NDK ────────────────────────────────────
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            install_target: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            install_target: true
            cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            install_target: true
            cross: true
          # ── macOS / iOS ──────────────────────────────────────────────────
          - target: x86_64-apple-darwin
            runner: macos-latest
            install_target: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            install_target: false
          - target: aarch64-apple-ios
            runner: macos-latest
            install_target: true
          - target: aarch64-apple-ios-sim
            runner: macos-latest
            install_target: true
          # ── Windows ──────────────────────────────────────────────────────
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            install_target: false
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            install_target: true
          # ── WASM ─────────────────────────────────────────────────────────
          # wasm32-unknown-unknown is now a hard gate as of Phase 3.3 + 3.5:
          # WebSocketLeg + WasmRuntime land; getrandom 0.4's `wasm_js` Cargo
          # feature is forced via core/Cargo.toml so the transitive
          # ml-dsa / uniffi-tempfile pulls compile cleanly.
          - target: wasm32-unknown-unknown
            runner: ubuntu-latest
            install_target: true
          # wasm32-wasi remains allow_failure: true — needs a WasiLeg +
          # WasiRuntime (mio does not support WASI; no tokio-wasi shim yet).
          # Scope, rationale, and step-by-step path forward documented in
          # docs/operations/wasi.md. Flip allow_failure once Step 4 there
          # is complete.
          - target: wasm32-wasi
            runner: ubuntu-latest
            install_target: true
            allow_failure: true
          # ── Embedded smoke (Phase 3.4 + 3.6) — bare-metal-green as of
          #    722c6cb via the no_std subset. Hard gate. Note the
          #    `cargo_args` matrix field: thumbv7em requires
          #    `--no-default-features --features embedded,no-std` to drop
          #    std-only deps (tokio, parking_lot, dashmap, etc.) from the
          #    dep graph and pick up only the embedded transport surface.
          - target: thumbv7em-none-eabihf
            runner: ubuntu-latest
            install_target: true
            cargo_args: "--no-default-features --features embedded,no-std"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.install_target && matrix.target || '' }}
      - name: Install cross (Linux cross targets)
        if: matrix.cross
        run: cargo install cross --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: ${{ matrix.target }}
      - name: cargo check (lib)
        continue-on-error: ${{ matrix.allow_failure == true }}
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross check --manifest-path core/Cargo.toml --lib --target ${{ matrix.target }} ${{ matrix.cargo_args }}
          else
            cargo check --manifest-path core/Cargo.toml --lib --target ${{ matrix.target }} ${{ matrix.cargo_args }}
          fi
        shell: bash
