name: cross-platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least-privilege default for GITHUB_TOKEN.
permissions:
  contents: read

# Cancel superseded in-progress runs on PR branches; never cancel a main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# This workflow only verifies that `phantom_core` *compiles* on each target —
# we do not run tests here because most targets cannot run unit tests on a
# GitHub-Actions hosted runner (cross-toolchain limitations, no QEMU, no
# browser sandbox). The CI matrix in `ci.yml` runs the full test suite on
# x86_64-unknown-linux-gnu.
#
# Each "compile-check" matrix entry is intentionally `cargo check` (not
# `cargo build`) so the job is fast and CI doesn't pay link time. The
# `--lib` target keeps the focus on the library; binaries / tests / examples
# may require target-specific code paths that are not yet ported.

jobs:
  compile-check:
    name: cargo check (${{ matrix.matrix_label || matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux server / mobile NDK ────────────────────────────────────
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            install_target: false
          # FIPS build (A9). `aws-lc-rs` is best-supported on
          # x86_64-unknown-linux-gnu; macOS / Windows can be added
          # later if a downstream cares. Needs cmake + a C
          # toolchain — install via the matrix `prep` step below.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            install_target: false
            cargo_args: "--features fips"
            matrix_label: "x86_64-unknown-linux-gnu (--features fips)"
            apt_install: cmake
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            install_target: true
            cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            install_target: true
            cross: true
          # ── macOS / iOS ──────────────────────────────────────────────────
          - target: x86_64-apple-darwin
            runner: macos-latest
            # macos-latest runners are aarch64, so the x86_64 std is not the
            # host target and must be installed explicitly.
            install_target: true
          - target: aarch64-apple-darwin
            runner: macos-latest
            install_target: false
          - target: aarch64-apple-ios
            runner: macos-latest
            install_target: true
          - target: aarch64-apple-ios-sim
            runner: macos-latest
            install_target: true
          # ── Windows ──────────────────────────────────────────────────────
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            install_target: false
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            install_target: true
          # ── WASM ─────────────────────────────────────────────────────────
          # wasm32-unknown-unknown is a hard gate as of Phase 3.3 + 3.5:
          # WebSocketLeg + WasmRuntime land; getrandom 0.4's `wasm_js` Cargo
          # feature is forced via core/Cargo.toml so the transitive ml-dsa
          # pulls compile cleanly. The browser target uses wasm-bindgen, NOT
          # UniFFI, so `bindings` is dropped here via `--no-default-features`
          # (mirroring the wasm32-wasip2 row): UniFFI 0.31's runtime is not
          # wasm32-unknown-unknown-compatible (its rust-future glue requires
          # `Send`, which browser futures are not) and its FFI scaffolding is
          # unused in the browser build.
          - target: wasm32-unknown-unknown
            runner: ubuntu-latest
            install_target: true
            cargo_args: "--no-default-features --features std,compression-zstd"
          # wasm32-wasip2 (Preview 2) — hard gate as of B6. The
          # `wasi-leg` Cargo feature pulls in `wasi 0.14` (WIT-bindgen
          # bindings for Preview 2) and the matching `WasiLeg` /
          # `WasiRuntime` modules. The library compiles end-to-end
          # without bindings (UniFFI's exported-symbol metadata is
          # incompatible with `wasm-component-ld`); the `--no-default-
          # features` flag drops bindings here. The host integration
          # test that round-trips a payload through `wasmtime` lives in
          # `core/tests/wasi_integration.rs` (`#[ignore]`-gated) and
          # is exercised by the dedicated `wasi-integration` job at
          # the bottom of this matrix.
          - target: wasm32-wasip2
            runner: ubuntu-latest
            install_target: true
            cargo_args: "--no-default-features --features std,wasi-leg"
          # ── Embedded smoke (Phase 3.4 + 3.6) — bare-metal-green as of
          #    722c6cb via the no_std subset. Hard gate. Note the
          #    `cargo_args` matrix field: thumbv7em requires
          #    `--no-default-features --features embedded,no-std` to drop
          #    std-only deps (tokio, parking_lot, dashmap, etc.) from the
          #    dep graph and pick up only the embedded transport surface.
          - target: thumbv7em-none-eabihf
            runner: ubuntu-latest
            install_target: true
            cargo_args: "--no-default-features --features embedded,no-std"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.install_target && matrix.target || '' }}
      - name: Install cross (Linux cross targets)
        if: matrix.cross
        run: cargo install cross --locked
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
          key: ${{ matrix.matrix_label || matrix.target }}
      - name: Install apt packages
        if: matrix.apt_install
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_install }}
      - name: cargo check (lib)
        continue-on-error: ${{ matrix.allow_failure == true }}
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross check --manifest-path core/Cargo.toml --lib --target ${{ matrix.target }} ${{ matrix.cargo_args }}
          else
            cargo check --manifest-path core/Cargo.toml --lib --target ${{ matrix.target }} ${{ matrix.cargo_args }}
          fi
        shell: bash

  # B6/B7 — wasi-leg coverage that needs a real WASI runtime.
  #
  # Two host-side integration tests live in
  # `core/tests/wasi_integration.rs`:
  #  - B5 byte-pipe round-trip (`block_on`-driven inside the guest);
  #  - B7 runtime+leg composition (`WasiRuntime::drive`-driven —
  #    closes the original review gap that the two pieces shipped
  #    without joint test coverage).
  # Both spawn the `phantom-wasi-guest` fixture under `wasmtime`.
  #
  # The in-tree `#[cfg(test)]` unit tests inside `wasi_runtime.rs`
  # and `wasi.rs` are gated on `cfg(all(feature = "wasi-leg",
  # target_os = "wasi"))` and therefore only compile under
  # `cargo test --target wasm32-wasip2 --features wasi-leg --lib`.
  # That command transitively pulls dev-dependencies (`criterion`,
  # `proptest`, `uniffi`-test-helpers) that are not wasi-compatible
  # at the source-of-truth crate level (e.g. `rusty-fork` /
  # `wait-timeout` from proptest's `fork` feature). Until those
  # upstream crates gain wasi support or get target-gated, the
  # unit tests are exercised on the host build (`cargo test --lib`
  # in `ci.yml`) for the cross-target pieces and by the integration
  # tests above for the wasi-specific behaviour.
  wasi-integration:
    name: wasi-leg integration (wasmtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
          key: wasi-integration
      - name: Install wasmtime
        # Pinned via the official installer script. The wasmtime CLI
        # provides the Preview 2 socket implementations the
        # `wasi-guest` fixture calls into.
        run: |
          curl -sSf https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: cargo test --test wasi_integration -- --ignored
        run: cargo test --manifest-path core/Cargo.toml --test wasi_integration -- --ignored
