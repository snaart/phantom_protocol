name: Fuzz

on:
  pull_request:
    branches: [main]
    # Only when something a harness exercises (or the fuzz setup itself) changes.
    paths:
      - 'core/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    # Daily long run, ~03:17 UTC (off-peak; odd minute dodges the top-of-hour
    # scheduler stampede). Scheduled runs fire on the default branch.
    - cron: '17 3 * * *'

# cargo-fuzz injects its own RUSTFLAGS (sanitizer-coverage + ASan). Do NOT set a
# repo-wide `-D warnings` here — it would be appended to the instrumented build
# and can spuriously fail it.
env:
  CARGO_TERM_COLOR: always

# Least-privilege default for GITHUB_TOKEN.
permissions:
  contents: read

# Cancel superseded in-progress runs on PR branches; never cancel a scheduled
# (default-branch) run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fuzz:
    name: cargo-fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Hard ceiling: cargo-fuzz install + instrumented build + the run. The
    # per-run budget below is at most 600s; 30m leaves ample headroom.
    timeout-minutes: 30
    strategy:
      # One red target must not cancel the others — each is an independent
      # parser we want signal on.
      fail-fast: false
      matrix:
        target:
          - fuzz_client_hello
          - fuzz_server_hello
          - fuzz_hello_retry
          - fuzz_packet_parse
          - fuzz_path_validation
          - fuzz_aead_decrypt
          - fuzz_embedded_framing
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # libFuzzer instrumentation + the ASan runtime require nightly. The
      # x86_64-linux nightly ships `rustc-nightly_rt.asan`, so the default
      # `-Zsanitizer=address` build links here (unlike macOS/aarch64).
      - name: Install nightly
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "fuzz"
          key: fuzz-${{ matrix.target }}
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2
        with:
          tool: cargo-fuzz
      # Copy the committed seeds into the (otherwise empty) corpus dir so the
      # parsers' success paths are reachable from input one.
      - name: Seed corpus
        run: bash fuzz/seed-corpus.sh ${{ matrix.target }}
      # 60s smoke on PRs (catch a freshly-introduced panic); 600s on the nightly
      # cron to dig deeper. rss limit guards against an OOM false-positive.
      #
      # `--target x86_64-unknown-linux-gnu` is load-bearing: cargo-fuzz defaults
      # the build target to its OWN host triple, and taiki-e/install-action ships
      # the musl prebuilt — so without this flag it builds for
      # x86_64-unknown-linux-musl, whose crt-static is incompatible with the
      # sanitizer and whose nightly std/ASan runtime isn't installed. Pin the gnu
      # target the runner actually has.
      - name: Fuzz ${{ matrix.target }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SECS=600
          else
            SECS=60
          fi
          echo "::notice::fuzzing ${{ matrix.target }} for ${SECS}s"
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "${{ matrix.target }}" -- \
            -max_total_time="$SECS" -rss_limit_mb=4096
      # On a crash, libFuzzer drops the reproducing input here — keep it so the
      # failure is reproducible off the runner.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
