name: bindings

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least-privilege default for GITHUB_TOKEN.
permissions:
  contents: read

# Cancel superseded in-progress runs on PR branches; never cancel a main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  drift:
    name: bindings drift
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
          key: bindings-drift
      - name: Regenerate Swift / Kotlin / Python bindings
        run: |
          tests/bindings/generate_swift.sh
          tests/bindings/generate_kotlin.sh
          tests/bindings/generate_python.sh
      - name: Verify the C header carries every API symbol
        run: |
          C_OUT="$(tests/bindings/generate_c.sh --release --skip-build 2>&1)"
          echo "$C_OUT"
          MISSING="$(echo "$C_OUT" \
            | sed -n '/in dylib but NOT mentioned/,/mentioned in header but NOT/p' \
            | grep -oE 'uniffi_phantom_protocol_fn_[A-Za-z0-9_]+' \
            | sort -u || true)"
          if [ -n "$MISSING" ]; then
            echo "::error::tests/bindings/c/phantom_protocol.h is missing API symbols:"
            echo "$MISSING"
            exit 1
          fi
      - name: Check binding manifest versions match core/Cargo.toml
        run: tests/bindings/check_versions.sh
      - name: Fail if committed bindings drifted
        run: git diff --exit-code -- tests/bindings/

  python:
    name: Python binding loopback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
          key: bindings-python
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Build cdylib + regenerate the Python binding
        run: tests/bindings/generate_python.sh
      - name: Stage the native library next to the binding
        run: cp target/release/libphantom_protocol.so tests/bindings/
      - name: Run the loopback smoke test
        run: python3 tests/run_test.py

  swift:
    name: Swift binding loopback
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
          key: bindings-swift
      - name: Build cdylib + regenerate the Swift binding
        run: tests/bindings/generate_swift.sh
      - name: Compile + run the loopback smoke test
        run: tests/bindings/swift/run_swift_test.sh

  kotlin:
    name: Kotlin binding compile-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
          key: bindings-kotlin
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Build cdylib + regenerate the Kotlin binding
        run: tests/bindings/generate_kotlin.sh
      - name: Compile-check via the harness
        run: tests/bindings/kotlin/run_kotlin_test.sh

  c:
    name: C consumer compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "."
          key: bindings-c
      - name: Build the cdylib
        run: cargo build --release --manifest-path core/Cargo.toml
      - name: Compile + run the C consumer
        # The source/object must precede `-lphantom_protocol`: GNU ld resolves
        # symbols left-to-right and drops a library's symbols if nothing seen so
        # far needs them. With the library first, every `uniffi_phantom_protocol_*`
        # reference in consumer_smoke.c is reported undefined.
        run: |
          cc -I tests/bindings/c \
             tests/bindings/c/consumer_smoke.c \
             -L target/release -lphantom_protocol \
             -o /tmp/phantom_c_smoke
          LD_LIBRARY_PATH=target/release /tmp/phantom_c_smoke
