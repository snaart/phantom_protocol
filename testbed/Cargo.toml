[package]
name = "phantom-testbed"
version = "0.3.0"
edition = "2021"
rust-version = "1.93"
description = "Real-network (WAN) test harness for phantom-protocol: multi-leg daemon + scenario-driving probe"
license = "Apache-2.0"
publish = false

# Sibling crate, out of the core/-only workspace — same convention as server/ and cli/.
[workspace]

[[bin]]
name = "phantom-testd"
path = "src/bin/testd.rs"

[[bin]]
name = "phantom-probe"
path = "src/bin/probe.rs"

# The wire-encryption check, on one machine and without privileges. Its
# privileged, real-path counterpart is a scenario inside phantom-probe; this
# binary exists so the question can be asked by anyone, anywhere, in one
# command.
[[bin]]
name = "phantom-wirecheck"
path = "src/bin/wirecheck.rs"

[dependencies]
# The testbed is a pure consumer of the published API. `mimicry` is on because
# the harness measures that leg; `bindings` (UniFFI) is off because nothing here
# crosses an FFI boundary.
phantom-protocol = { path = "../core", default-features = false, features = [
    "std",
    "compression-zstd",
    "classical-crypto",
    "mimicry",
] }

tokio = { version = "1.36", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
# Needed only to size the raw TCP control's socket buffers: with the OS default
# a 200 ms path caps at roughly buffer/RTT, so the "path ceiling" such a probe
# reports is really the kernel's default and not the link.
socket2 = { version = "0.5", features = ["all"] }

# The QUIC reference leg. quinn is the mature implementation the protocol under
# test is measured against, so it is deliberately taken as shipped rather than
# tuned to flatter or to handicap it.
#
# `default-features = false` drops `platform-verifier` (a system trust store is
# meaningless for a self-signed testbed certificate, and it pulls a large
# platform-specific tree) and selects the **ring** rustls provider rather than
# the default aws-lc-rs: `core` already links ring through `classical-crypto`,
# so ring is free here, whereas aws-lc-rs would drag cmake and a C toolchain
# onto a 2-core VPS for no benefit.
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
    "log",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }
rustls-pki-types = "1"
# Mints the daemon's self-signed certificate. `pem` is off — the certificate is
# persisted and pinned as raw DER, so there is nothing to base64-armour.
rcgen = { version = "0.13", default-features = false, features = [
    "crypto",
    "ring",
] }

[profile.release]
# The probe records timestamps around tight send/recv loops; debug symbols cost
# nothing at runtime and make a profiler or a crash dump readable.
debug = 1
