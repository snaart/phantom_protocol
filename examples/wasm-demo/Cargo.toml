[package]
name = "phantom-wasm-demo"
version = "0.0.0"
edition = "2021"
publish = false

# Keep out of the parent workspace (which is core/-only).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
phantom-protocol = { path = "../../core", default-features = false, features = ["std", "compression-zstd"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
