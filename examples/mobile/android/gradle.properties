# Project-wide Gradle settings.

# AndroidX is required by Jetpack Compose, lifecycle, and androidx.security.
android.useAndroidX=true

# Use the official Kotlin code style.
kotlin.code.style=official

# Give the Gradle daemon enough headroom for the Compose compiler.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable the configuration cache and parallel execution for faster builds.
org.gradle.parallel=true
org.gradle.caching=true

# Only generate the resources needed (avoids bundling the whole R class graph).
android.nonTransitiveRClass=true
