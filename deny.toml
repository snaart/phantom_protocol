# cargo-deny configuration for phantom_core.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # `rand` unsoundness fires only in a narrow scenario: a custom `log` logger
    # that calls `rand::rng()` and triggers a reseed mid-log. Phantom Core uses
    # `rand` only as a dev-dependency and transitively; the production RNG path
    # is OsRng/getrandom, and we never draw randomness from inside a logger, so
    # the aliasing UB is unreachable here.
    "RUSTSEC-2026-0097",
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
]
confidence-threshold = 0.92
exceptions = [
    # Pinned per-crate exceptions go here when justified.
]

[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = []
