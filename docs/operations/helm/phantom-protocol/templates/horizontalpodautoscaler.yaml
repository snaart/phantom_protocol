{{- if .Values.autoscaling.enabled -}}
# HPA using an external metric sourced from Prometheus via prometheus-adapter or KEDA.
# phantom_session_active is pushed by phantom-server over OTLP/gRPC to an OpenTelemetry
# Collector, exported to Prometheus, then surfaced to Kubernetes through
# prometheus-adapter (or KEDA). The phantom pods expose no scrape endpoint.
# Prerequisites: an OTel Collector with an otlp receiver + prometheus exporter, plus
# prometheus-adapter OR KEDA, must be installed and configured.
# See README.md "HPA prerequisites" for setup instructions.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "phantom-protocol.fullname" . }}-hpa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phantom-protocol.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "phantom-protocol.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    # External metric: phantom_session_active aggregated across all pods.
    # This requires prometheus-adapter to be configured with a custom metric rule
    # mapping the Prometheus query to the external metric name below.
    # Alternatively, replace with a KEDA ScaledObject (see kubernetes.md example).
    - type: External
      external:
        metric:
          name: {{ .Values.autoscaling.targetMetric }}
          selector:
            matchLabels:
              # Scope the metric query to pods belonging to this release.
              app.kubernetes.io/instance: {{ .Release.Name }}
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.targetValue }}
  behavior:
    scaleDown:
      # Conservative scale-down: wait 5 minutes before reducing replicas to
      # avoid premature scale-in when session counts briefly dip.
      stabilizationWindowSeconds: 300
      policies:
        - type: Replicas
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Replicas
          value: 2
          periodSeconds: 60
{{- end }}
