apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "phantom-protocol.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phantom-protocol.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # When HPA is enabled, HPA controls replica count; omit here to avoid conflicts.
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "phantom-protocol.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable: 0 ensures capacity is never reduced during rollout.
      # A new pod must pass readiness before the old one is terminated.
      # See: docs/operations/kubernetes.md "Rolling updates"
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "phantom-protocol.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "phantom-protocol.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      # fsGroup ensures the mounted signing-key Secret is readable by the container user.
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # PhantomListener::shutdown() is triggered on SIGTERM; in-flight handshakes
      # drain within terminationGracePeriodSeconds before force-kill.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "phantom-protocol.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            # Phantom Protocol opens only the transport port. Telemetry is PUSHED
            # over OTLP/gRPC to a Collector — there is no inbound metrics port.
            - name: phantom
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # Server config (see server/src/config.rs): PHANTOM_BIND is a full
            # SocketAddr, and PHANTOM_SIGNING_KEY_FILE must point at the mounted
            # Secret — the rootfs is read-only, so the binary's default
            # /etc/phantom-server/signing.key could not be created, and every
            # pod would otherwise mint a fresh identity and break client pinning.
            - name: PHANTOM_BIND
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: PHANTOM_SIGNING_KEY_FILE
              value: {{ printf "%s/%s" .Values.signingKey.mountPath .Values.signingKey.fileName | quote }}
            # OTLP push config (telemetry section). The server reads these env
            # vars; an empty otlpEndpoint leaves the exporter uninstalled.
            {{- with .Values.telemetry }}
            {{- if .otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .otlpEndpoint | quote }}
            {{- end }}
            {{- if .serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ .serviceName | quote }}
            {{- end }}
            {{- if .tracesSamplerArg }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .tracesSamplerArg | quote }}
            {{- end }}
            {{- if .otlpHeaders }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ .otlpHeaders | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Liveness: tcpSocket on the app port — a successful accept proves the
          # listener is alive. No /healthz endpoint; SDK ships no HTTP server.
          livenessProbe:
            tcpSocket:
              port: phantom
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          # Readiness: same probe, tighter delays. Pod is removed from Service
          # endpoints until ready, preventing traffic from reaching starting pods.
          readinessProbe:
            tcpSocket:
              port: phantom
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Hardened container security context (restricted PSS).
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            # Signing key mounted read-only; PHANTOM_SIGNING_KEY_FILE above is
            # rendered from these same values, so the paths always match.
            - name: signing-key
              mountPath: {{ .Values.signingKey.mountPath }}
              readOnly: true
            # tmpfs scratch space; readOnlyRootFilesystem requires this for any temp writes.
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: signing-key
          secret:
            secretName: {{ include "phantom-protocol.signingKeySecretName" . }}
            items:
              - key: {{ .Values.signingKey.existingSecretKey }}
                path: {{ .Values.signingKey.fileName }}
        # tmpfs: avoids disk I/O and keeps readOnlyRootFilesystem=true functional.
        - name: tmp
          emptyDir:
            medium: Memory
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
