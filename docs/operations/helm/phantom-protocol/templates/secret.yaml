{{- if .Values.signingKey.createSecret -}}
{{- if not .Values.signingKey.secretValue -}}
{{- fail "signingKey.createSecret is true but signingKey.secretValue is empty. Provide a value or use signingKey.existingSecret instead." -}}
{{- end -}}
# WARNING: This Secret is managed by Helm. The key material will be stored in
# the Helm release history (itself a Kubernetes Secret) and visible via
# `helm get values --show-secrets`. For production use, prefer:
#   - external-secrets-operator (Vault, AWS Secrets Manager, GCP Secret Manager)
#   - sealed-secrets (Bitnami) for GitOps workflows
# See README.md for an ExternalSecret snippet.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "phantom-protocol.fullname" . }}-signing-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phantom-protocol.labels" . | nindent 4 }}
  annotations:
    # Prevents Helm from displaying the value in plain-text diffs.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # The HybridSigningKey bytes. NEVER commit this value to version control.
  # Generate via your keygen toolchain and inject at deploy time via:
  #   --set signingKey.secretValue="$(cat hybrid_signing_key.bin | base64)"
  {{ .Values.signingKey.existingSecretKey }}: {{ .Values.signingKey.secretValue | quote }}
{{- end }}
