{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "phantom-protocol.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phantom-protocol.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Phantom Protocol does not call the Kubernetes API; disable token auto-mounting
# to reduce the attack surface (RBAC principle of least privilege).
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
