{{- if .Values.networkPolicy.enabled -}}
# NetworkPolicy requires a CNI plugin that enforces policies (Calico, Cilium, Weave).
# Without such a plugin, this resource is created but has no effect.
# See: docs/operations/kubernetes.md "NetworkPolicy"
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "phantom-core.fullname" . }}-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phantom-core.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "phantom-core.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound traffic on the app port and metrics port.
    # Restrict source via networkPolicy.ingressFrom (namespace / pod selectors).
    # An empty ingressFrom list permits traffic from any source within the cluster;
    # set at least a namespaceSelector in production to limit exposure.
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
        - port: {{ .Values.service.metricsPort }}
          protocol: TCP
      {{- if .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      {{- end }}
  egress:
    # DNS is always required: kube-dns resolution for any downstream service dial.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.networkPolicy.egressTo }}
    # Additional egress rules for downstream services your binary dials.
    - {{- toYaml .Values.networkPolicy.egressTo | nindent 6 }}
    {{- end }}
{{- end }}
