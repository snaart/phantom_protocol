{{- if .Values.pdb.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "phantom-core.fullname" . }}-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phantom-core.labels" . | nindent 4 }}
spec:
  # maxUnavailable: 0 means at least one pod must remain Ready at all times
  # during voluntary disruptions (node drain, cluster upgrades). Combined with
  # the Deployment rolling-update strategy (maxUnavailable: 0), capacity is
  # never reduced during either rolling updates or voluntary node disruptions.
  # See: docs/operations/kubernetes.md "PodDisruptionBudget"
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "phantom-core.selectorLabels" . | nindent 6 }}
{{- end }}
