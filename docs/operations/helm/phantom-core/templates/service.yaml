apiVersion: v1
kind: Service
metadata:
  name: {{ include "phantom-core.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phantom-core.labels" . | nindent 4 }}
  # Phantom Core exposes no inbound metrics port. It emits OpenTelemetry metrics
  # and traces and PUSHES them over OTLP/gRPC to an OpenTelemetry Collector
  # (configure via OTEL_EXPORTER_OTLP_ENDPOINT). Do not add prometheus.io/scrape
  # annotations here — there is no /metrics endpoint to scrape. To land metrics in
  # Prometheus, run a Collector with an otlp receiver + prometheus exporter and have
  # Prometheus scrape the Collector, never the phantom pods. See
  # docs/observability/metrics-catalog.md and docs/observability/otlp-setup.md.
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "phantom-core.selectorLabels" . | nindent 4 }}
  ports:
    - name: phantom
      port: {{ .Values.service.port }}
      targetPort: phantom
      protocol: TCP
