apiVersion: v1
kind: Service
metadata:
  name: {{ include "phantom-core.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phantom-core.labels" . | nindent 4 }}
  annotations:
    # Uncomment to enable annotation-based Prometheus scraping (alternative to ServiceMonitor):
    # prometheus.io/scrape: "true"
    # prometheus.io/port: {{ .Values.service.metricsPort | quote }}
    # prometheus.io/path: "/metrics"
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "phantom-core.selectorLabels" . | nindent 4 }}
  ports:
    - name: phantom
      port: {{ .Values.service.port }}
      targetPort: phantom
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
